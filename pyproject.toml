[project]
name = "youtube-downloader"
version = "1.1.2"
description = "A local-only YouTube downloader with a single-video flow and one-ZIP playlist batches."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Arbi04", email = "arbirestandi12@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.163.2",
    "yt-dlp[default]>=2026.10.26",
]

[project.scripts]
youtube-downloader = "youtube_downloader:main"

[project.urls]
Repository = "https://github.com/Arbi04/youtube-downloader"
Issues = "https://github.com/Arbi04/youtube-downloader/issues"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
