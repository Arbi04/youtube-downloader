<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YouTube Downloader</title>
    <link rel="stylesheet" href="/static/app.css" />
    <script src="/static/htmx.min.js" defer></script>
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <h1>YouTube<br />Downloader</h1>
        <p class="tagline">Paste a link. Pick a format. Save the file.</p>
      </header>

      <section class="card">
        <form
          class="url-form"
          hx-post="/preview"
          hx-target="#result"
          hx-swap="innerHTML"
          hx-disabled-elt="find button"
        >
          <label class="visually-hidden" for="url">YouTube URL</label>
          <input
            id="url"
            name="url"
            type="url"
            inputmode="url"
            autocomplete="off"
            placeholder="https://www.youtube.com/watch?v=..."
            required
          />
          <button class="btn btn-primary" type="submit">Check link</button>
        </form>

        <div id="result" class="result">
          <p class="hint">Video preview appears here.</p>
        </div>
      </section>

      <div id="job-slot"></div>

      <footer class="notes">
        <span>Runs on your machine.</span>
        <span>One video or playlist at a time.</span>
        <span>Playlists up to 25 videos.</span>
      </footer>
    </main>
  </body>
</html>
